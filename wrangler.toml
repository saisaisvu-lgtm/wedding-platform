pages_build_output_dir = "./public"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "wedding-platform-db"
database_id = "bc7c4338-fb40-4367-a038-e11324e71be5"

# 非敏感环境变量
[vars]
SITE_URL = "https://mylove.sairx.cn"

# ⚠️ 以下密钥请通过 Cloudflare Dashboard 或 wrangler secret 设置，不要写在仓库里！
# wrangler pages secret put SESSION_SECRET
# wrangler pages secret put ADMIN_KEY
# wrangler pages secret put BARK_KEY