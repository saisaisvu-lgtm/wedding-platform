<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>囍 · 光影婚礼墙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Liu+Jian+Mao+Cao&family=Zhi+Mang+Xing&family=Long+Cang&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Serif SC', 'Songti SC', 'STSong', '华文楷体', serif;
      background: #faf9f7;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
    }

    .controls {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 8px;
      padding-top: max(8px, env(safe-area-inset-top));
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184,134,11,0.1);
      opacity: 1;
      transition: opacity 0.4s ease, transform 0.4s ease;
      flex-wrap: wrap;
      min-height: 44px;
      pointer-events: auto;
    }
    
    .controls.fullscreen-mode {
      opacity: 0;
      transform: translateY(-100%);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    
    .controls.fullscreen-mode.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    
    @media (max-width: 768px) {
      .controls {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
      }
      
      .controls.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
    }
    
    body:hover .controls:not(.fullscreen-mode) { 
      opacity: 1; 
    }
    
    .controls button {
      background: rgba(184,134,11,0.08);
      border: 1px solid rgba(184,134,11,0.25);
      color: #6b5a4a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      backdrop-filter: blur(4px);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .controls button:active { background: rgba(184,134,11,0.2); border-color: #b8860b; transform: scale(0.95); transition: all 0.1s; }
    
    .controls button.active { background: rgba(184,134,11,0.2); border-color: #b8860b; color: #8b6914; }
    
    .controls .sep { 
      width: 1px; 
      height: 14px; 
      background: rgba(255, 255, 200, 0.3); 
      margin: 0 2px;
    }
    
    .controls .speed-label { 
      font-size: 10px; 
      color: rgba(255, 245, 220, 0.9); 
      margin-left: 2px; 
    }

    .hotzone-indicator {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 3px;
      background: rgba(184,134,11,0.3);
      border-radius: 0 0 3px 3px;
      z-index: 101;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    
    .hotzone-indicator.visible {
      opacity: 1;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #fdf2f0 0%, #f5e6e0 30%, #f0d6cc 60%, #e8c4b8 100%);
      transition: opacity 0.8s ease;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      overflow: hidden;
    }
    #loading-screen::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.4) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(255,255,255,0.3) 0%, transparent 40%);
      pointer-events: none;
    }
    #loading-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(255,255,255,0.2) 0%, transparent 40%);
      pointer-events: none;
    }
    
    #loading-screen .xi {
      font-family: 'Ma Shan Zheng', cursive, serif;
      font-size: min(22vw, 22vh, 100px);
      color: #c41e3a;
      text-shadow: 0 0 40px rgba(196,30,58,0.3);
      animation: xiPulse 2s ease-in-out infinite;
      line-height: 1;
      position: relative;
      z-index: 1;
    }
    
    #loading-screen .title {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: clamp(18px, 5vw, 28px);
      color: #8b6914;
      letter-spacing: 0.4em;
      margin-top: 2vh;
      text-align: center;
      position: relative;
      z-index: 1;
      font-weight: 600;
    }
    #loading-screen .title-line {
      width: clamp(60px, 20vw, 120px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #b8860b, transparent);
      margin: 1.5vh auto;
      position: relative;
      z-index: 1;
    }
    
    #loading-screen .countdown {
      margin-top: 2vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(12px, 3vw, 24px);
      opacity: 0;
      animation: countdownFadeIn 1s ease 0.5s forwards;
      position: relative;
      z-index: 1;
    }
    @keyframes countdownFadeIn {
      to { opacity: 1; }
    }
    #loading-screen .countdown .cd-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: clamp(48px, 12vw, 80px);
    }
    #loading-screen .countdown .cd-num {
      font-family: 'Noto Serif SC', 'Songti SC', 'Georgia', serif;
      font-size: clamp(36px, 10vw, 64px);
      color: #8b6914;
      line-height: 1;
      font-weight: 700;
      min-width: 1.4em;
      text-align: center;
    }
    #loading-screen .countdown .cd-label {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(10px, 2.5vw, 14px);
      color: #a08060;
      letter-spacing: 0.15em;
      text-transform: lowercase;
    }
    #loading-screen .countdown .cd-sep {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(24px, 6vw, 40px);
      color: #b8860b;
      margin-top: 2px;
      font-weight: 300;
    }
    #loading-screen .countdown .cd-date-label {
      width: 100%;
      text-align: center;
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(13px, 3vw, 16px);
      color: #a08060;
      letter-spacing: 0.3em;
      margin-top: 2vh;
    }

    #loading-screen .save-date {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: clamp(14px, 3.5vw, 20px);
      color: #8b6914;
      letter-spacing: 0.3em;
      margin-top: 3vh;
      position: relative;
      z-index: 1;
      font-weight: 600;
    }
    #loading-screen .save-date-num {
      font-family: 'Noto Serif SC', 'Georgia', serif;
      font-size: clamp(16px, 4vw, 22px);
      color: #a08060;
      letter-spacing: 0.4em;
      margin-top: 1vh;
      position: relative;
      z-index: 1;
    }

    #loading-screen .progress-container {
      margin-top: 3vh;
      width: min(70%, 320px);
      height: 3px;
      background: rgba(184,134,11,0.15);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    
    #loading-screen .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #b8860b, #d4a843);
      border-radius: 2px;
      transition: width 0.3s ease;
      will-change: width;
    }
    
    #loading-screen .progress-text {
      margin-top: 1.5vh;
      font-size: 12px;
      color: #a08060;
      letter-spacing: 0.1em;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    
    #loading-screen .enter-buttons {
      display: none;
      margin-top: 3vh;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.5s ease;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }
    
    #loading-screen .enter-buttons.show { 
      display: flex; 
      opacity: 1; 
    }
    
    #loading-screen .enter-buttons button {
      background: rgba(184, 134, 11, 0.12);
      border: 1px solid rgba(184, 134, 11, 0.5);
      color: #8b6914;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      letter-spacing: 0.1em;
      min-width: 130px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-weight: 500;
    }
    
    #loading-screen .enter-buttons button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    
    #loading-screen .enter-buttons button:hover {
      background: rgba(184, 134, 11, 0.25);
      transform: translateY(-1px);
    }
    
    #loading-screen .enter-buttons button:active { 
      background: rgba(184, 134, 11, 0.35);
      transform: scale(0.96); 
      transition: all 0.1s;
    }
    
    @keyframes xiPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    #gridwall {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      background: #f5f3ef;
      display: none;
    }
    
    #gridwall .grid-track {
      display: flex;
      flex-direction: column;
      gap: 3px;
      animation: gridScrollUp 50s linear infinite;
      will-change: transform;
    }
    
    #gridwall .grid-row {
      display: flex;
      gap: 3px;
      height: 22vh;
      flex-shrink: 0;
    }
    
    #gridwall .grid-row:nth-child(even) { animation: gridScrollL 40s linear infinite; }
    #gridwall .grid-row:nth-child(odd) { animation: gridScrollR 40s linear infinite; }
    
    #gridwall .grid-item {
      flex: none;
      height: 100%;
      aspect-ratio: 3/2;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      contain: layout style;
    }
    
    #gridwall .grid-item .blur-fill {
      position: absolute;
      inset: -15px;
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.9);
      z-index: 0;
    }
    
    #gridwall .grid-item img {
      position: relative;
      z-index: 2;
      max-width: 92%;
      max-height: 92%;
      object-fit: contain;
      border-radius: 3px;
      -webkit-user-drag: none;
    }
    
    @keyframes gridScrollL {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    
    @keyframes gridScrollR {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }
    
    @keyframes gridScrollUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    #magazine {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: none;
      overflow: hidden;
      background: #f5f3ef;
      touch-action: pan-x;
    }
    
    .mag-page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      opacity: 0;
      transform: translateX(30px);
      transition: all 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .mag-page.active {
      opacity: 1;
      transform: translateX(0);
      z-index: 2;
    }
    
    .mag-page.prev {
      opacity: 0;
      transform: translateX(-30px);
      z-index: 1;
    }
    
    .mag-page.next {
      opacity: 0;
      transform: translateX(30px);
      z-index: 1;
    }
    
    @media (min-width: 769px) {
      #magazine {
        perspective: 2000px;
      }
      
      .mag-page {
        transform: rotateY(0deg);
        transition: none;
      }
      
      .mag-page.active {
        z-index: 3;
        opacity: 1;
        transform: rotateY(0deg);
      }
      
      .mag-page.next {
        z-index: 2;
        opacity: 1;
        transform: rotateY(0deg);
      }
      
      .mag-page.prev {
        z-index: 1;
        opacity: 0;
        transform: rotateY(-30deg);
      }
      
      .mag-page.flip-out-left {
        animation: flipOutLeft 0.8s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        z-index: 4;
      }
      
      .mag-page.flip-in-right {
        animation: flipInRight 0.8s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        z-index: 3;
      }
      
      .mag-page.flip-out-right {
        animation: flipOutRight 0.8s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        z-index: 4;
      }
      
      .mag-page.flip-in-left {
        animation: flipInLeft 0.8s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        z-index: 3;
      }
      
      @keyframes flipOutLeft {
        0% { transform: rotateY(0deg); opacity: 1; }
        100% { transform: rotateY(-90deg); opacity: 0.3; }
      }
      
      @keyframes flipInRight {
        0% { transform: rotateY(90deg); opacity: 0.3; }
        100% { transform: rotateY(0deg); opacity: 1; }
      }
      
      @keyframes flipOutRight {
        0% { transform: rotateY(0deg); opacity: 1; }
        100% { transform: rotateY(90deg); opacity: 0.3; }
      }
      
      @keyframes flipInLeft {
        0% { transform: rotateY(-90deg); opacity: 0.3; }
        100% { transform: rotateY(0deg); opacity: 1; }
      }
      
      .mag-page::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, 
          transparent 0%, 
          rgba(212, 175, 55, 0.1) 40%, 
          rgba(212, 175, 55, 0.2) 50%, 
          rgba(212, 175, 55, 0.1) 60%, 
          transparent 100%);
        pointer-events: none;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      
      .mag-page.flip-out-left::after,
      .mag-page.flip-in-right::after,
      .mag-page.flip-out-right::after,
      .mag-page.flip-in-left::after {
        opacity: 1;
        animation: shimmer 0.8s ease;
      }
      
      @keyframes shimmer {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
    }
    
    .mag-page .mag-img {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 200px;
    }

    /* ===== Wedding Bubbles ===== */
    .wedding-bubble {
      position: absolute;
      z-index: 5;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(196,30,58,0.85), rgba(178,34,52,0.8));
      border: 1px solid rgba(212,175,55,0.6);
      border-radius: 20px;
      color: #fff;
      font-family: 'ZCOOL KuaiLe', 'Ma Shan Zheng', cursive, sans-serif;
      font-size: clamp(12px, 1.8vh, 16px);
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3), 0 0 8px rgba(196,30,58,0.2);
      animation: bubbleFloat 3s ease-in-out infinite;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.5s ease, transform 0.5s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      letter-spacing: 0.05em;
      line-height: 1.4;
    }
    .wedding-bubble.show {
      opacity: 1;
      transform: scale(1);
    }
    .wedding-bubble::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(178,34,52,0.85);
    }
    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }
    .wedding-bubble:nth-child(odd) { animation-delay: -1.5s; }
    .wedding-bubble:nth-child(3n) { animation-duration: 3.5s; }
    .wedding-bubble:nth-child(4n) { animation-duration: 2.8s; }
    .wedding-bubble:nth-child(5n) {
      background: linear-gradient(135deg, rgba(212,175,55,0.85), rgba(180,150,40,0.8));
      border-color: rgba(196,30,58,0.5);
      color: #2a1a0a;
      text-shadow: none;
    }
    .wedding-bubble:nth-child(5n)::after {
      border-top-color: rgba(180,150,40,0.85);
    }
    .wedding-bubble:nth-child(7n) {
      font-size: clamp(10px, 1.5vh, 14px);
      padding: 4px 10px;
    }
    .wedding-bubble:nth-child(3n+1) {
      transform: rotate(-2deg);
    }
    .wedding-bubble:nth-child(3n+2) {
      transform: rotate(1.5deg);
    }
    
    .blur-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(50px) brightness(0.8) saturate(0.8);
      transform: scale(1.2);
      z-index: 0;
    }
    
    #magazine .mag-page .mag-img img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      z-index: 2;
      position: relative;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      border-radius: 6px;
      -webkit-user-drag: none;
    }

    #magazine .mag-page .mag-text {
      flex: 0 0 38%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vh 2vw;
      background: linear-gradient(160deg, #fdf6e3 0%, #f5ede0 40%, #ede1d0 100%);
      color: #3a2a1a;
      position: relative;
      gap: 0.8vh;
      min-width: 0;
      overflow: hidden;
    }
    #magazine .mag-page .mag-text .text-blur-bg {
      position: absolute; inset: -20px;
      background-size: cover;
      background-position: center;
      filter: blur(60px) brightness(0.8) saturate(0.6);
      opacity: 0.3;
      z-index: 0;
    }
    #magazine .mag-page .mag-text > *:not(.text-blur-bg) {
      position: relative;
      z-index: 1;
    }

    #magazine .mag-page .mag-text .text-blur-bg {
      position: absolute;
      inset: -20px;
      background-size: cover;
      background-position: center;
      filter: blur(50px) brightness(0.3) saturate(1.3);
      z-index: 0;
    }

    #magazine .mag-page .mag-text > *:not(.text-blur-bg) {
      position: relative;
      z-index: 1;
    }

    #magazine .mag-page .mag-text::before {
      content: '';
      position: absolute;
      top: 5%;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }
    
    #magazine .mag-page .mag-text::after {
      content: '';
      position: absolute;
      bottom: 5%;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }

    #magazine .mag-page .mag-text .mag-xi {
      font-family: 'ZCOOL KuaiLe', 'Ma Shan Zheng', 'Liu Jian Mao Cao', 'Zhi Mang Xing', 'Long Cang', cursive, sans-serif;
      font-size: clamp(60px, 14vh, 120px);
      color: #b8860b;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(184,134,11,0.15), 0 0 20px rgba(212,175,55,0.2);
      font-weight: normal;
      letter-spacing: 0.05em;
      transition: transform 0.3s ease;
      animation: xiBounce 3s ease-in-out infinite;
      flex-shrink: 0;
    }
    
    @keyframes xiBounce {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    
    #magazine .mag-page .mag-text .mag-quote {
      font-size: clamp(13px, 2vh, 18px);
      line-height: 1.8;
      color: #5a4a3a;
      text-align: center;
      letter-spacing: 0.1em;
      font-style: italic;
      max-width: 95%;
      padding: 0.8vh 1.5vw;
      background: rgba(184,134,11,0.06);
      border-radius: 8px;
      border-left: 3px solid #b8860b;
      word-break: keep-all;
      overflow-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;

    /* ===== Music Player & Lyrics ===== */
    
    /* --- Singing Bar (bottom) --- */
    .sing-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 90;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: linear-gradient(0deg, rgba(253,246,227,0.9) 0%, rgba(253,246,227,0.4) 60%, transparent 100%);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .sing-bar.active {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* --- Singing side (avatar + lyrics pair) --- */
    .sing-side {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      padding: 0 10px;
    }
    .sing-side.left {
      flex-direction: row;
      justify-content: flex-end;
      padding-right: 20px;
    }
    .sing-side.right {
      flex-direction: row-reverse;
      justify-content: flex-end;
      padding-left: 20px;
    }
    
    .sing-avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    
    .sing-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(212, 175, 55, 0.7);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .sing-avatar.show {
      opacity: 1;
      transform: scale(1);
    }
    .sing-avatar.singing {
      animation: singBounce 0.5s ease-in-out infinite alternate;
    }
    
    .mic-icon {
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .mic-icon.show {
      opacity: 1;
      animation: micPulse 0.8s ease-in-out infinite alternate;
    }
    
    .avatar-name {
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
      font-size: 10px;
      color: rgba(212,175,55,0.8);
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .avatar-name.show { opacity: 1; }
    
    @keyframes singBounce {
      0% { transform: scale(1) translateY(0) rotate(-3deg); }
      100% { transform: scale(1.08) translateY(-4px) rotate(3deg); }
    }
    @keyframes micPulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.2); opacity: 1; }
    }
    
    /* --- Lyrics text --- */
    .lyrics-area {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }
    .sing-side.left .lyrics-area {
      justify-content: flex-start;
    }
    .sing-side.right .lyrics-area {
      justify-content: flex-end;
    }
    
    .lyrics-text {
      font-family: 'ZCOOL KuaiLe', 'Ma Shan Zheng', cursive, sans-serif;
      font-size: clamp(17px, 2.8vh, 26px);
      color: #3a2a1a;
      text-shadow: 0 1px 4px rgba(255,255,255,0.8);
      letter-spacing: 0.08em;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    
    .lyrics-text .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }
    .lyrics-text .char.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .lyrics-text .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #d4af37;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.6s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    /* --- Mobile --- */
    @media (max-width: 768px) {
      .sing-bar { height: 100px; }
      .sing-avatar { width: 38px; height: 38px; }
      .mic-icon { font-size: 11px; }
      .avatar-name { font-size: 9px; }
      .lyrics-text { font-size: clamp(15px, 2.4vh, 22px); }
      .sing-side.left { padding-right: 10px; }
      .sing-side.right { padding-left: 10px; }
    }
    
    @media (max-width: 380px) {
      .sing-bar { height: 85px; }
      .sing-avatar { width: 32px; height: 32px; }
      .lyrics-text { font-size: clamp(13px, 2vh, 18px); }

      const imageCache = new Map();

      const hotzoneIndicator = document.getElementById('hotzone-indicator');

      /* ===== Utilities ===== */
      function getCachedSrc(url) {
        return imageCache.has(url) ? imageCache.get(url) : url;
      }

      function isFullscreenMode() {
        return !!(document.fullscreenElement || 
                  document.webkitFullscreenElement || 
                  document.mozFullScreenElement ||
                  document.msFullscreenElement);
      }

      function showControls() {
        if (isMobile) {
          controlsBar.classList.add('visible');
        } else if (isFullscreen) {
          controlsBar.classList.add('visible');
          hotzoneIndicator.classList.remove('visible');
        }
        clearTimeout(controlsTimeout);
        controlsTimeout = setTimeout(hideControls, 3000);
      }

      function hideControls() {
        controlsBar.classList.remove('visible');
      }

      function updateFullscreenState() {
        const wasFullscreen = isFullscreen;
        isFullscreen = isFullscreenMode();
        
        if (isFullscreen && !wasFullscreen) {
          controlsBar.classList.add('fullscreen-mode');
          controlsBar.classList.remove('visible');
          hotzoneIndicator.classList.add('visible');
          document.addEventListener('mousemove', handleMouseMove, { passive: true });
        } else if (!isFullscreen && wasFullscreen) {
          controlsBar.classList.remove('fullscreen-mode', 'visible');
          hotzoneIndicator.classList.remove('visible');
          document.removeEventListener('mousemove', handleMouseMove);
          clearTimeout(controlsTimeout);
        }
      }

      function handleMouseMove(e) {
        if (!isFullscreen) return;
        if (e.clientY <= 50) showControls();
        else if (e.clientY > 100) { clearTimeout(controlsTimeout); hideControls(); }
      }

      document.addEventListener('fullscreenchange', updateFullscreenState);
      document.addEventListener('webkitfullscreenchange', updateFullscreenState);

      controlsBar.addEventListener('mouseenter', () => {
        if (isFullscreen) clearTimeout(controlsTimeout);
      });
      controlsBar.addEventListener('mouseleave', () => {
        if (isFullscreen) controlsTimeout = setTimeout(hideControls, 1000);
      });

      function setupMobileControls() {
        if (!isMobile || mobileTouchHandler) return;
        let hideTimeout;
        const show = () => {
          controlsBar.classList.add('visible');
          clearTimeout(hideTimeout);
          hideTimeout = setTimeout(() => controlsBar.classList.remove('visible'), 3000);
        };
        mobileTouchHandler = (e) => {
          if (!e.target.closest('button')) show();
        };
        document.addEventListener('touchstart', mobileTouchHandler, { passive: true });
        show();
      }

      /* ===== Preload ===== */
      async function preloadImages() {
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const enterButtons = document.getElementById('enter-buttons');
        const btnGridwall = document.getElementById('btn-enter-gridwall');
        const btnMagazine = document.getElementById('btn-enter-magazine');
        
        const allUrls = [...PHOTO_FILES, ...AVATAR_FILES, ...CREDITS_PHOTO_FILES];
        const total = allUrls.length;
        let loadedCount = 0;

        btnGridwall.disabled = true;
        btnMagazine.disabled = true;

        const updateUI = () => {
          const percent = Math.round((loadedCount / total) * 100);
          progressBar.style.width = percent + '%';
          progressText.textContent = `正在准备您的回忆… ${percent}% (${loadedCount}/${total})`;
        };

        const loadImage = (url) => new Promise((resolve) => {
          if (imageCache.has(url)) { loadedCount++; updateUI(); return resolve(); }
          const img = new Image();
          const timeout = setTimeout(() => {
            if (!imageCache.has(url)) { loadedCount++; updateUI(); }
            resolve();
          }, 8000);
          img.onload = () => {
            clearTimeout(timeout);
            if (img.naturalWidth > 0) imageCache.set(url, img.src);
            loadedCount++; updateUI(); resolve();
          };
          img.onerror = () => {
            clearTimeout(timeout);
            loadedCount++; updateUI(); resolve();
          };
          img.src = url;
        });

        const queue = [...allUrls];
        while (queue.length > 0) {
          const batch = queue.splice(0, isMobile ? 4 : 6);
          await Promise.all(batch.map(loadImage));
        }

        allImagesLoaded = true;
        progressText.textContent = '一切就绪，点击下方进入';
        progressBar.style.width = '100%';
        enterButtons.classList.add('show');
        btnGridwall.disabled = false;
        btnMagazine.disabled = false;
      }

      /* ===== Enter Mode ===== */
      window.enterMode = function(mode) {
        if (!allImagesLoaded) return;
        const ls = document.getElementById('loading-screen');
        ls.style.opacity = '0';
        setTimeout(() => { ls.style.display = 'none'; }, 800);
        controlsBar.style.display = 'flex';
        updateFullscreenState();
        if (isMobile) setupMobileControls();
        else if (!isFullscreen) { controlsBar.classList.remove('fullscreen-mode'); controlsBar.style.opacity = '1'; }
        
        document.getElementById('particles').style.display = 'block';
        initParticles();
        
        if (mode === 'gridwall') {
          buildGridwall();
          document.getElementById('gridwall').style.display = 'block';
          document.getElementById('btn-gridwall').classList.add('active');
          document.getElementById('btn-magazine').classList.remove('active');
        } else {
          buildMagazine();
          document.getElementById('magazine').style.display = 'block';
          document.getElementById('btn-magazine').classList.add('active');
          document.getElementById('btn-gridwall').classList.remove('active');

        startAutoPlay();
      };

      function initParticles() {
        const c = document.getElementById('particles');
        c.innerHTML = '';

      /* ===== Build Gridwall ===== */
      function buildGridwall() {
        const el = document.getElementById('gridwall');
        el.innerHTML = '';
        const track = document.createElement('div');
        track.className = 'grid-track';
        const perRow = isMobile ? 4 : 6;
        const rowsNeeded = Math.ceil(PHOTOS.length / perRow);
        
        for (let rep = 0; rep < 2; rep++) {
          for (let r = 0; r < rowsNeeded; r++) {
            const row = document.createElement('div');
            row.className = 'grid-row';
            const startIdx = (r * perRow) % PHOTOS.length;
            for (let dup = 0; dup < 2; dup++) {
              for (let j = 0; j < perRow; j++) {
                const photo = PHOTOS[(startIdx + j) % PHOTOS.length];
                const item = document.createElement('div');
                item.className = 'grid-item';
                const blurFill = document.createElement('div');
                blurFill.className = 'blur-fill';
                blurFill.style.backgroundImage = `url(${getCachedSrc(photo.src)})`;
                item.appendChild(blurFill);
                const img = document.createElement('img');
                img.src = getCachedSrc(photo.src);
                img.alt = photo.label;
                img.loading = 'lazy';
                item.appendChild(img);
                row.appendChild(item);
              }
            }
            track.appendChild(row);
          }
        }
        el.appendChild(track);
      }

      function addWeddingBubbles() {
        const pages = document.querySelectorAll('#magazine .mag-page');

          if (!imgDiv) return;

      /* ===== Magazine Navigation ===== */
      async function magazineNext(direction) {
        if (isAnimating) return;
        const pages = document.querySelectorAll('#magazine .mag-page');
        if (!pages.length) return;
        isAnimating = true;
        
        const currentPage = pages[currentIndex];
        const nextIndex = direction === 'next'
          ? (currentIndex + 1) % pages.length
          : (currentIndex - 1 + pages.length) % pages.length;
        const nextPage = pages[nextIndex];
        const cleanup = ['flip-out-left','flip-in-right','flip-out-right','flip-in-left','prev','next'];
        
        if (isMobile) {
          currentPage.classList.remove('active');
          currentPage.classList.add(direction === 'next' ? 'prev' : 'next');
          nextPage.classList.remove('prev', 'next');
          nextPage.classList.add('active');
          await new Promise(r => setTimeout(r, 500));
          currentPage.classList.remove('prev', 'next');
          currentPage.style.opacity = '0';
          currentPage.style.transform = direction === 'next' ? 'translateX(-30px)' : 'translateX(30px)';
        } else {
          // Random animation selection
          const animations = [
            { out: 'flip-out-left', in: 'flip-in-right', initOut: 'rotateY(0deg)', initIn: 'rotateY(90deg)', finalOut: 'rotateY(-90deg)', finalIn: 'rotateY(0deg)' },
            { out: 'flip-out-right', in: 'flip-in-left', initOut: 'rotateY(0deg)', initIn: 'rotateY(-90deg)', finalOut: 'rotateY(90deg)', finalIn: 'rotateY(0deg)' },
          ];
          const anim = animations[Math.floor(Math.random() * animations.length)];
          pages.forEach(p => p.classList.remove(...cleanup));
          nextPage.style.opacity = '1';
          nextPage.style.transform = anim.initIn;
          requestAnimationFrame(() => {
            currentPage.classList.add(anim.out);
            nextPage.classList.add(anim.in);
          });
          const rect = currentPage.getBoundingClientRect();
          createPageParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
          await new Promise(r => setTimeout(r, 800));
          currentPage.classList.remove(...cleanup, 'active');
          currentPage.style.opacity = '0';
          currentPage.style.transform = anim.finalOut;
          nextPage.classList.remove(...cleanup);
          nextPage.classList.add('active');
          nextPage.style.transform = anim.finalIn;
          nextPage.style.opacity = '1';
        }
        currentIndex = nextIndex;
        isAnimating = false;
      }

      function createPageParticles(x, y) {
        if (isMobile) return;
        const container = document.createElement('div');
        container.className = 'page-particles';
        container.style.left = x + 'px';
        container.style.top = y + 'px';
        for (let i = 0; i < 12; i++) {
          const p = document.createElement('div');
          p.className = 'page-particle';
          const angle = (Math.PI * 2 * i) / 12;
          const dist = 40 + Math.random() * 60;
          p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
          p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
          p.style.animationDelay = Math.random() * 0.2 + 's';
          container.appendChild(p);
        }
        document.body.appendChild(container);
        setTimeout(() => container.remove(), 1200);
      }

        if (e.ctrlKey && e.key === 's') { e.preventDefault(); return false; }
        // Ctrl+U (View Source)
        if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        // Ctrl+P (Print)
        if (e.ctrlKey && e.key === 'p') { e.preventDefault(); return false; }
        // Ctrl+Shift+I (DevTools)
        if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
        // Ctrl+Shift+J (DevTools Console)
        if (e.ctrlKey && e.shiftKey && e.key === 'J') { e.preventDefault(); return false; }
        // Ctrl+Shift+C (Element Inspector)
        if (e.ctrlKey && e.shiftKey && e.key === 'C') { e.preventDefault(); return false; }
        // F12 (DevTools)
        if (e.key === 'F12') { e.preventDefault(); return false; }
        // PrintScreen
        if (e.key === 'PrintScreen') {
          navigator.clipboard.writeText('');
          e.preventDefault();
          return false;
        }
      });
      
      // Disable PrintScreen via clipboard API
      document.addEventListener('keyup', e => {
        if (e.key === 'PrintScreen') {
          navigator.clipboard.writeText('').catch(() => {});
        }
      });
      
      // Clear canvas to prevent canvas-based screenshot APIs
      const blockCanvasScreenshot = () => {
        const canvases = document.querySelectorAll('canvas');
        canvases.forEach(c => {
          const ctx = c.getContext('2d');
          if (ctx) ctx.clearRect(0, 0, c.width, c.height);
        });
      };
      
      // Disable iOS screenshot gestures (visual viewport shrink)
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        document.addEventListener('gesturestart', e => e.preventDefault());
        let lastTouchEnd = 0;
        document.addEventListener('touchend', e => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) e.preventDefault();
          lastTouchEnd = now;
        }, { passive: false });
      }
      
      // DevTools detection (simple timing-based)
      (function detectDevTools() {
        const threshold = 160;
        let open = false;
        setInterval(() => {
          const start = performance.now();
          debugger;
          const end = performance.now();
          if (end - start > threshold && !open) {
            open = true;
            document.body.innerHTML = '<div style="position:fixed;inset:0;background:#0c0c0c;display:flex;align-items:center;justify-content:center;color:#c41e3a;font-size:24px;z-index:9999;font-family:sans-serif;">请关闭开发者工具后刷新页面</div>';
          } else if (end - start <= threshold) {
            open = false;
          }
        }, 2000);
      })();
      
      /* ===== RSVP ===== */
      window.submitRSVP = async function() {
        const name = document.getElementById('rsvp-name').value.trim();
        const phone = document.getElementById('rsvp-phone').value.trim();
        const msgEl = document.getElementById('rsvp-msg');
        const btn = document.getElementById('rsvp-submit');

        if (!name) { msgEl.className = 'rsvp-msg err'; msgEl.textContent = '请输入您的姓名'; return; }
        if (!phone) { msgEl.className = 'rsvp-msg err'; msgEl.textContent = '请输入联系电话'; return; }

        btn.disabled = true;
        btn.textContent = '提交中...';
        msgEl.textContent = '';

        try {
          const res = await fetch('/api/rsvp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slug: SLUG,
              name,
              phone,
              guests: parseInt(document.getElementById('rsvp-guests').value) || 1,
              arrival_time: document.getElementById('rsvp-arrival').value,
              transport: document.getElementById('rsvp-transport').value
            })
          });
          const data = await res.json();
          if (data.ok) {
            msgEl.className = 'rsvp-msg ok';
            msgEl.textContent = data.message;
            // 显示参与码
            if (data.participation_code) {
              document.getElementById('invite-participation-code').textContent = data.participation_code;
            }
            setTimeout(() => showInviteCard(), 1200);
          } else {
            msgEl.className = 'rsvp-msg err';
            msgEl.textContent = data.error || '提交失败';
          }
        } catch (e) {
          msgEl.className = 'rsvp-msg err';
          msgEl.textContent = '网络错误，请稍后重试';
        } finally {
          btn.disabled = false;
          btn.textContent = '确认提交';
        }
      };

      window.skipRSVP = function() {
        enterRSVPDone();
      };

      /* ===== 请帖功能 ===== */
      function showInviteCard() {
        const rsvpEl = document.getElementById('rsvp-screen');
        rsvpEl.style.transition = 'opacity 0.5s ease';
        rsvpEl.style.opacity = '0';
        setTimeout(() => {
          rsvpEl.classList.add('hidden');
          document.getElementById('invite-overlay').classList.add('show');
          generateQRCode();
        }, 500);
      }

      function generateQRCode() {
        var box = document.getElementById('invite-qr-box');
        if (!box) return;
        box.innerHTML = '';
        try {
          var qr = qrcode(0, 'M');
          var weddingUrl = window.location.origin + window.location.pathname;
          qr.addData(weddingUrl);
          qr.make();
          var size = 100;
          var cellSize = Math.floor(size / qr.getModuleCount());
          var margin = Math.floor((size - cellSize * qr.getModuleCount()) / 2);
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#e75480';
          ctx.globalAlpha = 0.9;
          for (var row = 0; row < qr.getModuleCount(); row++) {
            for (var col = 0; col < qr.getModuleCount(); col++) {
              if (qr.isDark(row, col)) {
                ctx.fillRect(
                  margin + col * cellSize,
                  margin + row * cellSize,
                  cellSize,
                  cellSize
                );
              }
            }
          }
          box.appendChild(canvas);
        } catch (e) {
          console.log('QR generation failed:', e);
        }
      }

      window.saveInvite = function() {
        const btn = document.getElementById('btn-invite-save');
        btn.disabled = true;
        btn.textContent = '生成中...';

        const card = document.getElementById('invite-card');

        html2canvas(card, {
          scale: 3,
          backgroundColor: '#fff5f8',
          useCORS: true,
          allowTaint: true,
          logging: false
        }).then(function(canvas) {
          const link = document.createElement('a');
          link.download = 'wedding-invitation.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          btn.disabled = false;
          btn.textContent = '💾 保存请帖';
        }).catch(function() {
          alert('保存失败，请截图保存');
          btn.disabled = false;
          btn.textContent = '💾 保存请帖';
        });
      };

      window.enterFromInvite = function() {
        const el = document.getElementById('invite-overlay');
        el.style.transition = 'opacity 0.5s ease';
        el.style.opacity = '0';
        setTimeout(() => {
          el.classList.remove('show');
          el.style.opacity = '';
          enterRSVPDone();
        }, 500);
      };

      function enterRSVPDone() {
        const el = document.getElementById('rsvp-screen');
        el.style.transition = 'opacity 0.6s ease';
        el.style.opacity = '0';
        setTimeout(() => { el.classList.add('hidden'); }, 600);
      }

      /* ===== Countdown ===== */
      let WEDDING_DATE = Date.now() + 86400000;
      function updateCountdown() {
        const now = Date.now();
        const diff = WEDDING_DATE - now;
        if (diff <= 0) {
          document.getElementById('cd-days').textContent = '0';
          document.getElementById('cd-hours').textContent = '00';
          document.getElementById('cd-mins').textContent = '00';
          document.getElementById('cd-secs').textContent = '00';
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('cd-days').textContent = d;
        document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
        document.getElementById('cd-mins').textContent = String(m).padStart(2, '0');
        document.getElementById('cd-secs').textContent = String(s).padStart(2, '0');
      }
      updateCountdown();
      setInterval(updateCountdown, 1000);

      /* ===== Init ===== */
      /* ===== API Data Loading ===== */
      let WEDDING = null;
      const SLUG = (function(){const p=location.pathname.split('/').filter(Boolean);return p[p.length-1];})();

      async function loadWeddingData() {
        if (!SLUG || SLUG === 'index.html') { showError('页面不存在'); return false; }
        try {
          const res = await fetch('/api/wedding/' + SLUG);
          const data = await res.json();
          if (!data.ok) { showError(data.error || '加载失败'); return false; }
          WEDDING = data.wedding;
          const imgs = data.images;
          AVATAR_FILES = (imgs.avatars || []).map(a => a.url);
          CREDITS_PHOTO_FILES = (imgs.credits || []).map(c => c.url);
          PHOTO_FILES = (imgs.gallery || []).map(g => g.url);
          PHOTOS = PHOTO_FILES.map((url, idx) => ({ src: url, label: '永恒瞬间 ' + (idx + 1), quote: ALL_QUOTES[idx % ALL_QUOTES.length] }));
          populateUI();
          return true;
        } catch (e) { showError('网络错误'); return false; }
      }

      function showError(msg) {
        document.getElementById('loading-screen').innerHTML =
          '<div style="text-align:center;padding:40px"><div style="font-size:60px;margin-bottom:16px">😢</div>' +
          '<div style="font-size:18px;color:#d4af37;margin-bottom:8px">页面不存在</div>' +
          '<div style="font-size:14px;color:rgba(255,245,220,0.5)">' + msg + '</div></div>';
      }

      function populateUI() {
        if (!WEDDING) return;
        document.title = '囍 · ' + WEDDING.couple_name;
        // RSVP
        document.getElementById('rsvp-subtitle').textContent = WEDDING.partner1 + ' & ' + WEDDING.partner2 + ' · 婚礼出席确认';
        document.getElementById('rsvp-names').textContent = WEDDING.partner1 + ' & ' + WEDDING.partner2;
        const arrSel = document.getElementById('rsvp-arrival');
        (WEDDING.arrival_options || []).forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; arrSel.appendChild(op); });
        const trSel = document.getElementById('rsvp-transport');
        (WEDDING.transport_options || []).forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; trSel.appendChild(op); });
        // Invite card avatars
        const av1 = document.getElementById('ic-avatar1');
        const av2 = document.getElementById('ic-avatar2');
        if (av1 && AVATAR_FILES[0]) { av1.src = AVATAR_FILES[0]; av1.crossOrigin = 'anonymous'; } else if (av1) { av1.style.display = 'none'; }
        if (av2 && AVATAR_FILES.length > 1) { av2.src = AVATAR_FILES[1]; av2.crossOrigin = 'anonymous'; } else if (av2) { av2.src = AVATAR_FILES[0] || ''; av2.crossOrigin = 'anonymous'; }
        if (!AVATAR_FILES[0] && av1) av1.style.display = 'none';
        if (!AVATAR_FILES[0] && !AVATAR_FILES[1] && av2) av2.style.display = 'none';
        document.getElementById('ic-names').textContent = WEDDING.partner1 + ' & ' + WEDDING.partner2;
        document.getElementById('ic-names-en').textContent = (WEDDING.partner1 + ' & ' + WEDDING.partner2).toUpperCase();
        if (WEDDING.wedding_date) {
          const d = new Date(WEDDING.wedding_date + 'T00:00:00');
          const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
          document.getElementById('ic-date').textContent = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + days[d.getDay()];
          // Update countdown target
          WEDDING_DATE = new Date(WEDDING.wedding_date + 'T11:58:00').getTime();
          document.querySelector('.cd-date-label').textContent = '距离婚礼 · ' + WEDDING.wedding_date;
          // Update save the date display
          const dateParts = WEDDING.wedding_date.split('-');
          document.getElementById('save-date-num').textContent = dateParts[0] + '.' + dateParts[1] + '.' + dateParts[2];
        }
        if (WEDDING.wedding_venue) {
          document.getElementById('ic-info').textContent = '📍 ' + WEDDING.wedding_venue;
        }
        // Sing bar
        if (AVATAR_FILES[0]) document.getElementById('sing-avatar-1').src = AVATAR_FILES[0];
        if (AVATAR_FILES[1]) document.getElementById('sing-avatar-2').src = AVATAR_FILES[1] || AVATAR_FILES[0];
        document.getElementById('avatar-name-1').textContent = WEDDING.partner1;
        document.getElementById('avatar-name-2').textContent = WEDDING.partner2;
        document.getElementById('f-sign').textContent = WEDDING.partner1 + ' & ' + WEDDING.partner2;
        // BGM
        const bgmSrc = WEDDING.bgm_url || WEDDING.bgm_data;
        if (bgmSrc) { const bgm = document.getElementById('bgm'); bgm.innerHTML = '<source src="' + bgmSrc + '" type="audio/mpeg">'; }
      }

      window.addEventListener('DOMContentLoaded', async () => {
        const ok = await loadWeddingData();
        if (ok) {
          preloadImages();
          updateFullscreenState();
        }
      });
    })();
  </script>
