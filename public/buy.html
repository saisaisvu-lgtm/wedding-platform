<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购买邀请码 — 光影婚礼墙</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .buy-container { max-width: 520px; margin: 0 auto; padding: 32px 24px; }
    .buy-header { text-align: center; margin-bottom: 32px; }
    .buy-header h1 { font-family: var(--font-serif); font-size: 28px; color: var(--text); letter-spacing: 0.06em; margin-bottom: 8px; }
    .buy-header h1 .accent { color: var(--primary); }
    .buy-header p { color: var(--text-secondary); font-size: 15px; }
    .steps { display: flex; gap: 8px; margin-bottom: 28px; }
    .step-item { flex: 1; text-align: center; }
    .step-item .step-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg-subtle); border: 1.5px solid var(--border);
      color: var(--text-muted); font-size: 14px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px;
      transition: var(--transition);
    }
    .step-item .step-text { font-size: 12px; color: var(--text-muted); }
    .step-item.active .step-num { background: var(--primary-pale); border-color: var(--primary); color: var(--primary); }
    .price-box {
      text-align: center; background: var(--primary-pale);
      border: 1px solid rgba(184,134,11,0.15); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px;
    }
    .price-box .price { font-family: var(--font-serif); font-size: 42px; font-weight: 700; color: var(--primary); }
    .price-box .unit { font-size: 15px; color: var(--text-secondary); margin-left: 4px; }
    .qr-section { margin-bottom: 24px; }
    .qr-tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid var(--border-light); }
    .qr-tab {
      flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 500;
      color: var(--text-muted); cursor: pointer; border: none; background: none;
      border-bottom: 2px solid transparent; margin-bottom: -2px; font-family: inherit; transition: var(--transition);
    }
    .qr-tab:hover { color: var(--text); }
    .qr-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .qr-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px; text-align: center;
    }
    .qr-card img { max-width: 240px; width: 100%; border-radius: var(--radius); }
    .qr-hint { font-size: 13px; color: var(--text-muted); margin-top: 12px; }
    .no-qr { text-align: center; color: var(--text-muted); padding: 32px; font-size: 14px; }
    .order-section {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 28px; margin-bottom: 24px;
    }
    .order-section .order-title { font-family: var(--font-serif); font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 18px; }
    .order-alert { padding: 14px 18px; border-radius: var(--radius); font-size: 14px; margin-bottom: 16px; display: none; text-align: center; font-weight: 500; }
    .order-alert.show { display: block; animation: fadeIn 0.3s ease; }
    .order-alert.error { background: var(--accent-pale); border: 1px solid rgba(196,30,58,0.15); color: var(--accent); }
    .waiting-spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(184,134,11,0.15); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;
    }
    .invite-code-box {
      background: #f0fdf4; border: 2px solid rgba(34,197,94,0.2);
      border-radius: var(--radius-lg); padding: 24px; margin: 20px auto; max-width: 300px;
    }
    .invite-code-box .code { font-size: 30px; font-weight: 700; color: #16a34a; font-family: monospace; letter-spacing: 0.15em; word-break: break-all; }
    .invite-code-box .code-label { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    .countdown { font-size: 13px; color: var(--text-muted); margin-top: 14px; }
    .result-icon { font-size: 48px; margin-bottom: 14px; }
    .result-title { font-family: var(--font-serif); font-size: 20px; color: var(--text); margin-bottom: 10px; }
    .result-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 24px; }
    .order-result { text-align: center; padding: 36px 24px; }
    .back-link { text-align: center; margin-top: 24px; }
    .back-link a { color: var(--text-secondary); font-size: 14px; }
    .back-link a:hover { color: var(--primary); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo"><span class="xi">囍</span> 光影婚礼墙</a>
    <div class="nav-links">
      <a href="/register.html">返回注册</a>
      <a href="/login.html">已有账号？登录</a>
    </div>
  </nav>

  <div class="buy-container">
    <div class="buy-header">
      <h1>🎟️ 购买<span class="accent">邀请码</span></h1>
      <p>扫码付款后通知管理员，确认后自动获取邀请码</p>
    </div>

    <div class="steps">
      <div class="step-item active"><div class="step-num">1</div><div class="step-text">扫码付款</div></div>
      <div class="step-item"><div class="step-num">2</div><div class="step-text">通知管理员</div></div>
      <div class="step-item"><div class="step-num">3</div><div class="step-text">获取邀请码</div></div>
    </div>

    <div id="step1">
      <div class="price-box">
        <div class="price" id="priceNum">--<span class="unit">元/个</span></div>
        <div id="priceDesc" style="font-size:13px;color:var(--text-secondary);margin-top:8px;display:none;"></div>
      </div>
      <div id="contactInfoBox" style="background:var(--primary-pale);border:1px solid rgba(184,134,11,0.12);border-radius:var(--radius);padding:16px 18px;margin-bottom:24px;font-size:13px;color:var(--text-secondary);line-height:1.8;display:none;"></div>
      <div class="qr-section">
        <div class="qr-tabs" id="qrTabs" style="display:none;">
          <button class="qr-tab active" data-tab="wechat" onclick="switchQrTab('wechat')">📱 微信支付</button>
          <button class="qr-tab" data-tab="alipay" onclick="switchQrTab('alipay')">💳 支付宝</button>
        </div>
        <div id="qrContent"><div class="no-qr"><span class="spinner"></span> 加载中...</div></div>
      </div>
      <div class="order-section">
        <div class="order-title">📝 付款信息</div>
        <div id="orderAlert" class="order-alert"></div>
        <div class="form-group">
          <label>付款方式</label>
          <div style="display:flex;gap:10px;margin-bottom:16px;">
            <input type="radio" name="payMethod" id="payWechat" value="wechat" checked style="display:none;">
            <label for="payWechat" id="labelWechat" onclick="switchPayMethod('wechat')" style="flex:1;text-align:center;padding:12px;border:1.5px solid var(--primary);border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--primary);background:var(--primary-pale);font-weight:500;transition:all 0.2s;">📱 微信</label>
            <input type="radio" name="payMethod" id="payAlipay" value="alipay" style="display:none;">
            <label for="payAlipay" id="labelAlipay" onclick="switchPayMethod('alipay')" style="flex:1;text-align:center;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text-muted);transition:all 0.2s;">💳 支付宝</label>
          </div>
        </div>
        <div class="form-group"><label>您的联系方式 *</label><input type="text" id="orderContact" placeholder="微信号或手机号" required maxlength="50"></div>
        <div class="form-group"><label>备注（可选）</label><textarea id="orderNote" rows="2" placeholder="如：需要几个邀请码" maxlength="200"></textarea></div>
        <button class="btn btn-primary" id="payConfirmBtn" onclick="confirmPaid()" style="width:100%;padding:14px;font-size:16px;">✅ 我已付款，通知管理员</button>
      </div>
    </div>

    <div id="step2" style="display:none;">
      <div class="order-section">
        <div class="order-result">
          <div class="waiting-spinner"></div>
          <div class="result-title">⏳ 等待管理员确认</div>
          <div class="result-desc">已通知管理员核实付款<br>确认后邀请码将自动显示<br><br><span style="font-size:12px;color:var(--text-muted);">请勿关闭此页面</span></div>
          <div class="countdown" id="waitingTime">已等待 0 秒</div>
        </div>
      </div>
    </div>

    <div id="step3" style="display:none;">
      <div class="order-section">
        <div class="order-result">
          <div class="result-icon">🎉</div>
          <div class="result-title">邀请码获取成功！</div>
          <div class="result-desc">您的邀请码：</div>
          <div class="invite-code-box">
            <div class="code-label">邀请码</div>
            <div class="code" id="inviteCodeDisplay">--</div>
          </div>
          <div class="countdown" id="redirectCountdown">5 秒后自动跳转到注册页面…</div>
          <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <a id="registerLink" href="/register.html" class="btn btn-primary" style="width:auto;padding:10px 24px;">立即注册</a>
            <button class="btn btn-outline" onclick="copyCode()" style="padding:10px 24px;">📋 复制邀请码</button>
          </div>
        </div>
      </div>
    </div>

    <div class="back-link"><a href="/register.html">← 返回注册页面</a></div>
  </div>

  <div class="footer">光影婚礼墙 &copy; 2026</div>

  <script src="/js/api.js"></script>
  <script>
    let settingsData = null, hasWechat = false, hasAlipay = false, currentOrderId = null, pollTimer = null, waitTimer = null, waitingSeconds = 0;

    async function loadPayment() {
      try {
        const res = await fetch('/api/payment'); const data = await res.json();
        if (!data.ok) { document.getElementById('qrContent').innerHTML = '<div class="no-qr">暂未开放购买</div>'; return; }
        const s = data.settings; settingsData = s;
        document.getElementById('priceNum').innerHTML = s.price + '<span class="unit">元/个</span>';
        hasWechat = s.has_wechat; hasAlipay = s.has_alipay;
        if (s.price_desc) { document.getElementById('priceDesc').textContent = s.price_desc; document.getElementById('priceDesc').style.display = 'block'; }
        if (s.contact_info) { document.getElementById('contactInfoBox').textContent = s.contact_info; document.getElementById('contactInfoBox').style.display = 'block'; }
        if (hasWechat || hasAlipay) { if (hasWechat && hasAlipay) document.getElementById('qrTabs').style.display = 'flex'; renderQrContent('wechat'); }
        else document.getElementById('qrContent').innerHTML = '<div class="no-qr">收款码暂未配置</div>';
      } catch (e) { document.getElementById('qrContent').innerHTML = '<div class="no-qr">加载失败</div>'; }
    }

    function renderQrContent(type) {
      const c = document.getElementById('qrContent');
      if (type === 'wechat' && hasWechat) c.innerHTML = '<div class="qr-card"><img src="/api/payment-image?type=wechat" alt="微信收款码"><div class="qr-hint">长按或截图保存，打开微信扫一扫付款</div></div>';
      else if (type === 'alipay' && hasAlipay) c.innerHTML = '<div class="qr-card"><img src="/api/payment-image?type=alipay" alt="支付宝收款码"><div class="qr-hint">长按或截图保存，打开支付宝扫一扫付款</div></div>';
    }

    function switchQrTab(type) {
      document.querySelectorAll('.qr-tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.qr-tab[data-tab="'+type+'"]').classList.add('active');
      renderQrContent(type);
      document.getElementById(type === 'wechat' ? 'payWechat' : 'payAlipay').checked = true;
      updatePayMethodStyle(type);
    }

    function switchPayMethod(type) {
      document.getElementById(type === 'wechat' ? 'payWechat' : 'payAlipay').checked = true;
      updatePayMethodStyle(type);
      // 同步 QR 标签
      const hasType = type === 'wechat' ? hasWechat : hasAlipay;
      if (hasType) {
        document.querySelectorAll('.qr-tab').forEach(t => t.classList.remove('active'));
        const tab = document.querySelector('.qr-tab[data-tab="'+type+'"]');
        if (tab) tab.classList.add('active');
        renderQrContent(type);
      }
    }

    function updatePayMethodStyle(active) {
      const wLabel = document.getElementById('labelWechat');
      const aLabel = document.getElementById('labelAlipay');
      if (active === 'wechat') {
        wLabel.style.borderColor = 'var(--primary)';
        wLabel.style.color = 'var(--primary)';
        wLabel.style.background = 'var(--primary-pale)';
        wLabel.style.fontWeight = '500';
        aLabel.style.borderColor = 'var(--border)';
        aLabel.style.color = 'var(--text-muted)';
        aLabel.style.background = 'transparent';
        aLabel.style.fontWeight = '400';
      } else {
        aLabel.style.borderColor = 'var(--primary)';
        aLabel.style.color = 'var(--primary)';
        aLabel.style.background = 'var(--primary-pale)';
        aLabel.style.fontWeight = '500';
        wLabel.style.borderColor = 'var(--border)';
        wLabel.style.color = 'var(--text-muted)';
        wLabel.style.background = 'transparent';
        wLabel.style.fontWeight = '400';
      }
    }

    async function confirmPaid() {
      const alertEl = document.getElementById('orderAlert'); const btn = document.getElementById('payConfirmBtn');
      alertEl.className = 'order-alert'; alertEl.style.display = 'none';
      const contact = document.getElementById('orderContact').value.trim();
      if (!contact) { alertEl.textContent = '请填写联系方式'; alertEl.className = 'order-alert show error'; return; }
      const contactType = document.querySelector('input[name="payMethod"]:checked').value;
      const note = document.getElementById('orderNote').value.trim();
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 提交中...';
      try {
        const res = await apiPost('/api/order', { contact, contact_type: contactType, amount: settingsData?.price || 0, note });
        if (res.ok) {
          currentOrderId = res.order_id;
          document.getElementById('step1').style.display = 'none'; document.getElementById('step2').style.display = 'block';
          document.querySelectorAll('.step-item').forEach(s => s.classList.add('active'));
          startPolling(currentOrderId); startWaitingTimer();
        } else { alertEl.textContent = res.error || '提交失败'; alertEl.className = 'order-alert show error'; }
      } catch (e) { alertEl.textContent = '网络错误'; alertEl.className = 'order-alert show error'; }
      finally { btn.disabled = false; btn.textContent = '✅ 我已付款，通知管理员'; }
    }

    function startPolling(orderId) { stopPolling(); pollTimer = setInterval(async () => { try { const res = await fetch('/api/order?id='+orderId); const data = await res.json(); if (!data.ok) return; if (data.status === 'confirmed') { stopPolling(); stopWaitingTimer(); showInviteCode(data.invite_code); } else if (data.status === 'rejected') { stopPolling(); stopWaitingTimer(); showRejected(); } } catch (e) {} }, 3000); }
    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
    function startWaitingTimer() { waitingSeconds = 0; waitTimer = setInterval(() => { waitingSeconds++; const m = Math.floor(waitingSeconds/60), s = waitingSeconds%60; document.getElementById('waitingTime').textContent = m > 0 ? '已等待 '+m+' 分 '+s+' 秒' : '已等待 '+s+' 秒'; }, 1000); }
    function stopWaitingTimer() { if (waitTimer) { clearInterval(waitTimer); waitTimer = null; } }

    function showInviteCode(code) {
      document.getElementById('step2').style.display = 'none'; document.getElementById('step3').style.display = 'block';
      document.getElementById('inviteCodeDisplay').textContent = code;
      document.getElementById('registerLink').href = '/register.html?code='+encodeURIComponent(code);
      let countdown = 5; document.getElementById('redirectCountdown').textContent = countdown+' 秒后自动跳转到注册页面…';
      const timer = setInterval(() => { countdown--; if (countdown <= 0) { clearInterval(timer); window.location.href = '/register.html?code='+encodeURIComponent(code); } else document.getElementById('redirectCountdown').textContent = countdown+' 秒后自动跳转到注册页面…'; }, 1000);
    }

    function showRejected() {
      document.getElementById('step2').style.display = 'none'; document.getElementById('step3').style.display = 'block';
      document.querySelector('#step3 .result-icon').textContent = '❌';
      document.querySelector('#step3 .result-title').textContent = '订单被拒绝';
      document.querySelector('#step3 .result-desc').textContent = '管理员拒绝了此订单';
      document.querySelector('.invite-code-box').style.display = 'none';
      document.getElementById('redirectCountdown').textContent = '';
    }

    function copyCode() {
      const code = document.getElementById('inviteCodeDisplay').textContent;
      navigator.clipboard.writeText(code).then(() => { const btn = document.querySelector('#step3 .btn-outline'); btn.textContent = '✅ 已复制'; setTimeout(() => { btn.textContent = '📋 复制邀请码'; }, 2000); });
    }

    loadPayment();
  </script>
</body>
</html>
