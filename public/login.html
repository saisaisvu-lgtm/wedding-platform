<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 光影婚礼墙</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo"><span class="xi">囍</span> 光影婚礼墙</a>
    <div class="nav-links">
      <a href="/register.html">注册新账号</a>
    </div>
  </nav>

  <div class="container-sm" style="padding-top: 80px;">
    <div class="card">
      <h2 class="card-title"><span class="icon">🔐</span> 登录</h2>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" placeholder="输入用户名" required>
        </div>

        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="输入密码" required>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;margin-top:8px;">登录</button>
      </form>

      <div style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-muted);">
        没有账号？<a href="/register.html">去注册</a>
      </div>
    </div>
  </div>

  <div class="footer">光影婚礼墙 &copy; 2026</div>

  <script src="/js/api.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> 登录中...';

      try {
        const res = await apiPost('/api/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        });

        if (res.ok) {
          showAlert(alertEl, '登录成功！正在跳转...', 'success');
          setTimeout(() => window.location.href = '/dashboard.html', 500);
        } else {
          showAlert(alertEl, res.error || '登录失败');
        }
      } catch (err) {
        showAlert(alertEl, '网络错误，请稍后重试');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
